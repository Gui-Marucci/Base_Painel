<!--
  Componente Sidebar independente:
  - Carregado por fetch() em static/js/sidebar.js

-->
<aside class="sidebar" role="navigation" aria-label="Navegação principal">

        width="36"
        height="36"
      />

        <strong>ERP Gestão de Materiais</strong>

  <nav class="sidebar-nav" role="menu" aria-label="Menu principal">

        <li>

      <ul>
        <li>
          <a
